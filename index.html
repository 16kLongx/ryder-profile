<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryder // Profile</title>
    <!-- Gothic / Gangster Font & Inter & Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter:wght@300;400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent-color: #8b0000;
            --accent-glow: rgba(139, 0, 0, 0.7);
            --neon-red: #ff0055;
            --neon-blue: #00f0ff;
            --card-bg: rgba(10, 10, 12, 0.88);
            --text-main: #f0f0f0;
            --text-muted: #8a8a93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: var(--text-main);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT TV TARAMA ÇİZGİLERİ EFEKTİ */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* CLICK TO ENTER OVERLAY */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050505;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-btn {
            font-family: 'UnifrakturCook', cursive;
            font-size: 38px;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--accent-glow), 0 0 30px var(--accent-color);
            animation: pulse 1.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        /* MP4 HAREKETLİ ARKA PLAN VİDEOSU (PEXELS NEON GECE ŞEHRİ) */
        .bg-video-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-video-container video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.5) contrast(1.1);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(1px);
            z-index: -1;
        }

        /* MÜZİK KONTROL PANELİ */
        .audio-controls-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 15, 18, 0.85);
            border: 1px solid rgba(255, 0, 85, 0.4);
            padding: 8px 14px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .music-control {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-control:hover {
            color: var(--neon-red);
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }

        /* KANLI VE NEON KENAR IŞIKLI ANA KART */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.4), inset 0 0 15px rgba(255, 0, 85, 0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.3s;
            animation: neonBorderPulse 4s infinite alternate;
        }

        @keyframes neonBorderPulse {
            0% {
                box-shadow: 0 0 25px rgba(139, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 85, 0.1);
                border-color: rgba(255, 0, 85, 0.3);
            }
            100% {
                box-shadow: 0 0 40px rgba(255, 0, 85, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.2);
                border-color: rgba(0, 240, 255, 0.6);
            }
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* KAYAN ÜST BANT YAZISI */
        .top-bar {
            background: rgba(255, 0, 85, 0.12);
            border: 1px solid rgba(255, 0, 85, 0.4);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-red);
            margin-bottom: 18px;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.15);
        }

        .top-bar span {
            display: inline-block;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Header & GLITCH EFEKTİ */
        .header {
            text-align: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .glitch-title {
            font-family: 'UnifrakturCook', cursive;
            font-size: 56px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px var(--accent-glow), 0 0 30px rgba(139,0,0,0.8);
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        .glitch-title::before, .glitch-title::after {
            content: "Ryder";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
        }

        .glitch-title::before {
            left: 2px;
            text-shadow: -2px 0 #ff0055;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -2px;
            text-shadow: -2px 0 #00e5ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(40px, 9999px, 80px, 0); }
            40% { clip: rect(20px, 9999px, 50px, 0); }
            60% { clip: rect(70px, 9999px, 90px, 0); }
            80% { clip: rect(30px, 9999px, 60px, 0); }
            100% { clip: rect(50px, 9999px, 100px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 90px, 0); }
            20% { clip: rect(10px, 9999px, 40px, 0); }
            40% { clip: rect(80px, 9999px, 100px, 0); }
            60% { clip: rect(30px, 9999px, 70px, 0); }
            80% { clip: rect(50px, 9999px, 80px, 0); }
            100% { clip: rect(20px, 9999px, 50px, 0); }
        }

        /* Discord Kartı */
        .discord-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.03);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .discord-card:hover {
            border-color: #5865F2;
            background: rgba(88, 101, 242, 0.1);
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.3);
        }

        .avatar-box {
            position: relative;
            width: 55px;
            height: 55px;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .status-dot {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #747f8d;
            border: 3px solid #0c0c0e;
        }

        .status-dot.online { background: #23a55a; box-shadow: 0 0 8px #23a55a; }
        .status-dot.idle { background: #f0b232; }
        .status-dot.dnd { background: #f23f43; }

        .user-info .username {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

            font-size: 12px;
            color: var(--text-muted);
            margin-
