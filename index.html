<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryder // Profile</title>
    <!-- Gothic / Gangster Font & Inter & Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter:wght@300;400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent-color: #8b0000;
            --accent-glow: rgba(139, 0, 0, 0.7);
            --neon-red: #ff0055;
            --neon-blue: #00f0ff;
            --card-bg: rgba(10, 10, 12, 0.9);
            --text-main: #f0f0f0;
            --text-muted: #8a8a93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: var(--text-main);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* FARE İZİ (NEON ÇİZGİ) */
        .trail-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--neon-blue);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-red);
            transition: transform 0.2s, opacity 0.4s;
            z-index: 99999;
        }

        /* CRT TV TARAMA ÇİZGİLERİ EFEKTİ */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* CLICK TO ENTER OVERLAY */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050505;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-btn {
            font-family: 'UnifrakturCook', cursive;
            font-size: 38px;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--accent-glow), 0 0 30px var(--accent-color);
            animation: pulse 1.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        /* ARKA PLAN VİDEOSU */
        .bg-video-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-video-container video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.5) contrast(1.1);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(1px);
            z-index: -1;
        }

        /* MÜZİK KONTROL PANELİ */
        .audio-controls-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 15, 18, 0.85);
            border: 1px solid rgba(255, 0, 85, 0.4);
            padding: 8px 14px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .music-control {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-control:hover {
            color: var(--neon-red);
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }

        /* ANA KART */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.4), inset 0 0 15px rgba(255, 0, 85, 0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.3s;
            animation: neonBorderPulse 4s infinite alternate;
            max-height: 90vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-thumb {
            background: var(--neon-red);
            border-radius: 2px;
        }

        @keyframes neonBorderPulse {
            0% {
                box-shadow: 0 0 25px rgba(139, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 85, 0.1);
                border-color: rgba(255, 0, 85, 0.3);
            }
            100% {
                box-shadow: 0 0 40px rgba(255, 0, 85, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.2);
                border-color: rgba(0, 240, 255, 0.6);
            }
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* KAYAN ÜST BANT */
        .top-bar {
            background: rgba(255, 0, 85, 0.12);
            border: 1px solid rgba(255, 0, 85, 0.4);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-red);
            margin-bottom: 18px;
            overflow: hidden;
            white-space: nowrap;
        }

        .top-bar span {
            display: inline-block;
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* BAŞLIK */
        .header {
            text-align: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .glitch-title {
            font-family: 'UnifrakturCook', cursive;
            font-size: 56px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px var(--accent-glow), 0 0 30px rgba(139,0,0,0.8);
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        /* DISCORD KARTI */
        .discord-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.03);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .discord-card:hover {
            border-color: #5865F2;
            background: rgba(88, 101, 242, 0.1);
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.3);
        }

        .avatar-box {
            position: relative;
            width: 55px;
            height: 55px;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .status-dot {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #747f8d;
            border: 3px solid #0c0c0e;
        }
        .status-dot.online { background: #23a55a; box-shadow: 0 0 8px #23a55a; }

        .user-info .username {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .user-info .activity {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* LİNKLER */
        .links-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .steam-btn {
            background: linear-gradient(90deg, #171a21 0%, #1b2838 100%);
            border: 1px solid rgba(102, 192, 244, 0.2);
            color: #c6d4df;
        }
        .steam-btn:hover { border-color: #66c0f4; color: #fff; box-shadow: 0 0 15px rgba(102, 192, 244, 0.4); }

        .spotify-profile-btn {
            background: linear-gradient(90deg, #0f2b17 0%, #123d1f 100%);
            border: 1px solid rgba(30, 215, 96, 0.3);
            color: #1ed760;
        }
        .spotify-profile-btn:hover { border-color: #1ed760; color: #fff; box-shadow: 0 0 15px rgba(30, 215, 96, 0.4); }

        /* SÖZ KUTUSU */
        .quote-box {
            background: rgba(139, 0, 0, 0.15);
            border-left: 3px solid var(--neon-red);
            padding: 12px 14px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 16px;
            font-size: 12.5px;
            font-style: italic;
            color: #ddd;
        }

        /* SPOTİFY KARTI */
        .spotify-card {
            background: rgba(30, 215, 96, 0.05);
            border: 1px solid rgba(30, 215, 96, 0.18);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .spotify-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .equalizer {
            display: none;
            align-items: flex-end;
            gap: 3px;
            height: 14px;
        }
        .equalizer.active { display: flex; }
        .eq-bar {
            width: 3px;
            background: #1ed760;
            border-radius: 2px;
            animation: eq-bounce 1s infinite ease-in-out alternate;
        }
        @keyframes eq-bounce { 0% { height: 20%; } 100% { height: 100%; } }

        .spotify-content { display: flex; align-items: center; gap: 14px; }
        .spotify-album { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        .spotify-info .song-name { font-size: 13px; font-weight: 600; color: #fff; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .spotify-info .artist-name { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

        /* --- YORUM / ZİYARETÇİ DEFTERİ --- */
        .guestbook-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .gb-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .gb-textarea {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            outline: none;
            resize: none;
            height: 60px;
        }
        .gb-textarea:focus { border-color: var(--neon-red); }
        .gb-submit {
            background: var(--neon-red);
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(255,0,85,0.4);
        }
        .gb-submit:hover { opacity: 0.85; }

        .comments-list {
            max-height: 160px;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .comment-item {
            background: rgba(255,255,255,0.03);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 11.5px;
            position: relative;
            border-left: 2px solid var(--neon-blue);
        }
        .comment-author { font-weight: bold; color: var(--neon-blue); margin-bottom: 2px; }
        .comment-text { color: #ccc; word-break: break-word; }
        
        .delete-cmt {
            position: absolute;
            top: 6px;
            right: 8px;
            background: none;
            border: none;
            color: #ff3333;
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: 0.2s;
        }
        .comment-item:hover .delete-cmt { opacity: 1; }

        /* FOOTER */
        .footer {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
        }
        .visitor-count {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            padding: 5px 14px;
            border-radius: 20px;
            color: #ddd;
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* TOAST */
        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: var(--neon-red);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 10px 14px;
            position: fixed;
            z-index: 1000000;
            bottom: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            box-shadow: 0 0 20px var(--neon-red);
            opacity: 0;
            transition: opacity 0.4s, bottom 0.4s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 45px; }
    </style>
</head>
<body>

    <!-- OVERLAY -->
    <div id="overlay">
        <div class="enter-btn">[ CLICK TO ENTER ]</div>
    </div>

    <!-- MÜZİK KONTROL -->
    <div class="audio-controls-panel">
        <button class="music-control" id="music-toggle">
            <i class="fa-solid fa-volume-high" id="music-icon"></i> <span id="music-status">Müzik Açık</span>
        </button>
        <input type="range" class="volume-slider" id="volume-control" min="0" max="1" step="0.01" value="0.4">
    </div>

    <!-- VİDEO -->
    <div class="bg-video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="https://www.pexels.com/download/video/7232003/" type="video/mp4">
        </video>
    </div>

    <!-- SESLER -->
    <audio id="gun-sound" src="https://assets.mixkit.co/active_storage/sfx/2140/2140-preview.mp3" preload="auto"></audio>
    <audio id="bg-music" src="eski-biri.mp3" loop preload="auto"></audio>

    <div class="container" id="main-card">

        <!-- ÜST BANT -->
        <div class="top-bar">
            <span>"Acı Tanrıdan gelir, mutsuzluk ise insan işidir." // RYDER</span>
        </div>

        <!-- BAŞLIK -->
        <div class="header">
            <h1 class="glitch-title">Ryder</h1>
        </div>

        <!-- DİSCORD -->
        <div class="discord-card" onclick="copyDiscordName()">
            <div class="avatar-box">
                <img id="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                <div id="discord-status" class="status-dot"></div>
            </div>
            <div class="user-info">
                <div id="discord-username" class="username">★Ryder</div>
                <div id="discord-activity" class="activity">
                    <i class="fa-solid fa-gamepad"></i> <span id="activity-text">Şu an boşta</span>
                </div>
            </div>
        </div>

        <!-- LİNKLER -->
        <div class="links-group">
            <a href="https://steamcommunity.com/profiles/76561199810142952/" target="_blank" class="link-btn steam-btn" onclick="playGunSound()">
                <i class="fa-brands fa-steam"></i> Steam
            </a>
            <a href="https://open.spotify.com/user/31dqpa5ssk6uitgooyptqbbfanwi?si=61687de4f33d49ee" target="_blank" class="link-btn spotify-profile-btn" onclick="playGunSound()">
                <i class="fa-brands fa-spotify"></i> Spotify
            </a>
        </div>

        <!-- SÖZ -->
        <div class="quote-box">
            "Acı Tanrıdan gelir, mutsuzluk ise insan işidir."
        </div>

        <!-- SPOTİFY KARTI -->
        <div class="spotify-card">
            <div class="spotify-header">
                <div class="section-title">
                    <i class="fa-brands fa-spotify" style="color: #1ed760;"></i> ŞU AN DİNLENİYOR
                </div>
                <div class="equalizer" id="spotify-eq">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
            </div>
            <div class="spotify-content">
                <img id="spotify-cover" class="spotify-album" src="https://via.placeholder.com/60/111/fff?text=Music" alt="Cover">
                <div class="spotify-info">
                    <div id="spotify-title" class="song-name">Müzik Çalmıyor</div>
                    <div id="spotify-artist" class="artist-name">Spotify Pasif</div>
                </div>
            </div>
        </div>

        <!-- YORUM / ZİYARETÇİ DEFTERİ -->
        <div class="guestbook-card">
            <div class="section-title"><i class="fa-solid fa-comments"></i> SOKAK DUVARI (YORUMLAR)</div>
            <div class="gb-form">
                <textarea id="comment-text" class="gb-textarea" placeholder="Duvara bir söz bırak..." maxlength="120"></textarea>
                <button class="gb-submit" onclick="addComment()">YORUMU GÖNDER</button>
            </div>
            <div class="comments-list" id="comments-list">
                <!-- Yorumlar buraya düşecek -->
            </div>
        </div>

        <!-- SAYACI -->
        <div class="footer">
            <div class="visitor-count">
                <i class="fa-solid fa-eye"></i> <span id="visits">1</span> Ziyaretçi
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast">Discord Adı Kopyalandı! (rydeer1)</div>

    <!-- SCRIPT -->
    <script>
        // --- FARE İZİ (NEON ÇİZGİ EFEKTİ) ---
        document.addEventListener("mousemove", (e) => {
            const dot = document.createElement("div");
            dot.className = "trail-dot";
            dot.style.left = e.clientX + "px";
            dot.style.top = e.clientY + "px";
            document.body.appendChild(dot);

            setTimeout(() => {
                dot.style.transform = "scale(0)";
                dot.style.opacity = "0";
            }, 50);

            setTimeout(() => {
                dot.remove();
            }, 400);
        });

        // --- YORUM SİSTEMİ (ZİYARETÇİ DEFTERİ) ---
        let comments = JSON.parse(localStorage.getItem("ryder_comments") || "[]");
        renderComments();

        function addComment() {
            const textInput = document.getElementById("comment-text");
            const text = textInput.value.trim();

            if (!text) {
                alert("Lütfen bir yorum yaz kraker!");
                return;
            }

            playGunSound();
            const name = "Anonim Sokak Sakini";
            comments.unshift({ id: Date.now(), name, text });
            localStorage.setItem("ryder_comments", JSON.stringify(comments));

            textInput.value = "";
            renderComments();
        }

        function deleteComment(id) {
            playGunSound();
            comments = comments.filter(c => c.id !== id);
            localStorage.setItem("ryder_comments", JSON.stringify(comments));
            renderComments();
        }

        function renderComments() {
            const listEl = document.getElementById("comments-list");
            if (comments.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; font-size:11px; color:#666; padding:10px;">Henüz duvarı kirleten olmamış. İlk sözü sen bırak!</div>`;
                return;
            }

            listEl.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="comment-author">${escapeHtml(c.name)}</div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                    <button class="delete-cmt" onclick="deleteComment(${c.id})" title="Yorumu Sil"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- DİĞER FONKSİYONLAR (Müzik, Discord, Ses) ---
        const DISCORD_ID = "834164548344348713";
        const overlay = document.getElementById("overlay");
        const mainCard = document.getElementById("main-card");
        const gunSound = document.getElementById("gun-sound");
        const bgMusic = document.getElementById("bg-music");
        const musicToggle = document.getElementById("music-toggle");
        const musicIcon = document.getElementById("music-icon");
        const musicStatus = document.getElementById("music-status");
        const volumeControl = document.getElementById("volume-control");
        const spotifyEq = document.getElementById("spotify-eq");

        let isPlaying = false;
        let lastPlayedSong = "";

        function playGunSound() {
            gunSound.currentTime = 0;
            gunSound.play().catch(() => {});
        }

        overlay.addEventListener("click", () => {
            overlay.classList.add("hidden");
            mainCard.classList.add("visible");
            playGunSound();

            bgMusic.volume = volumeControl.value;
            bgMusic.play().then(() => {
                isPlaying = true;
                musicIcon.className = "fa-solid fa-volume-high";
                musicStatus.innerText = "Müzik Açık";
            }).catch(() => {});
        });

        musicToggle.addEventListener("click", (e) => {
            e.stopPropagation();
            playGunSound();
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
                musicIcon.className = "fa-solid fa-volume-xmark";
                musicStatus.innerText = "Müzik Kapalı";
            } else {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicIcon.className = "fa-solid fa-volume-high";
                    musicStatus.innerText = "Müzik Açık";
                }).catch(() => {});
            }
        });

        volumeControl.addEventListener("input", (e) => {
            bgMusic.volume = e.target.value;
        });

        function copyDiscordName() {
            playGunSound();
            navigator.clipboard.writeText("rydeer1");
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // LANYARD
        function connectLanyard() {
            const ws = new WebSocket("wss://api.lanyard.rest/socket");
            ws.onopen = () => {
                ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.t === "INIT_STATE" || data.t === "PRESENCE_UPDATE") {
                    updateProfile(data.d);
                }
            };
            ws.onclose = () => setTimeout(connectLanyard, 5000);
        }

        function updateProfile(userData) {
            if (!userData) return;
            const user = userData.discord_user;
            let cleanName = (user.global_name || user.username).replace(/★/g, '').trim();
            document.getElementById("discord-username").innerText = "★" + cleanName;
            
            const avatarUrl = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : "https://cdn.discordapp.com/embed/avatars/0.png";
            document.getElementById("discord-avatar").src = avatarUrl;
            document.getElementById("discord-status").className = "status-dot " + userData.discord_status;

            const customAct = userData.activities.find(a => a.type === 0);
            document.getElementById("activity-text").innerText = customAct ? customAct.name + " oynuyor" : "Şu an boşta";

            if (userData.listening_to_spotify && userData.spotify) {
                const sp = userData.spotify;
                document.getElementById("spotify-title").innerText = sp.song;
                document.getElementById("spotify-artist").innerText = sp.artist;
                document.getElementById("spotify-cover").src = sp.album_art_url;
                spotifyEq.classList.add("active");
            } else {
                document.getElementById("spotify-title").innerText = "Müzik Çalmıyor";
                document.getElementById("spotify-artist").innerText = "Spotify Pasif";
                document.getElementById("spotify-cover").src = "https://via.placeholder.com/60/111/fff?text=Off";
                spotifyEq.classList.remove("active");
            }
        }

        // ZİYARETÇİ SAYACI
        let visits = parseInt(localStorage.getItem("ryder_real_visits") || "125");
        if (!sessionStorage.getItem("has_visited_session")) {
            visits += 1;
            localStorage.setItem("ryder_real_visits", visits);
            sessionStorage.setItem("has_visited_session", "true");
        }
        document.getElementById("visits").innerText = visits;

        connectLanyard();
    </script>
</body>
</html>
