<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryder // Profile</title>
    <!-- Gothic / Gangster Font & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent-color: #8b0000;
            --accent-glow: rgba(139, 0, 0, 0.7);
            --card-bg: rgba(10, 10, 12, 0.88);
            --text-main: #f0f0f0;
            --text-muted: #8a8a93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: var(--text-main);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* CRT TV TARAMA ÇİZGİLERİ EFEKTİ */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* CLICK TO ENTER OVERLAY */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050505;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-btn {
            font-family: 'UnifrakturCook', cursive;
            font-size: 38px;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--accent-glow), 0 0 30px var(--accent-color);
            animation: pulse 1.8s infinite alternate;
            user-select: none;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        /* STREAMABLE HAREKETLİ ARKA PLAN VİDEOSU */
        .bg-video-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-video-container iframe {
            position: absolute;
            top: 50%; left: 50%;
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            transform: translate(-50%, -50%) scale(1.2);
            filter: brightness(0.7) contrast(1.1);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
            backdrop-filter: blur(1px);
            z-index: -1;
        }

        /* MÜZİK KONTROL & SES SEVİYESİ PANELİ */
        .audio-controls-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 15, 18, 0.85);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 8px 14px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .music-control {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-control:hover {
            color: #ff4d4d;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* ANA KART */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95), 0 0 35px rgba(139, 0, 0, 0.25);
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.3s;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Header & GLITCH EFEKTİ */
        .header {
            text-align: center;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
        }

        .glitch-title {
            font-family: 'UnifrakturCook', cursive;
            font-size: 56px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px var(--accent-glow), 0 0 30px rgba(139,0,0,0.8);
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        .glitch-title::before, .glitch-title::after {
            content: "Ryder";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
        }

        .glitch-title::before {
            left: 2px;
            text-shadow: -2px 0 #ff0055;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -2px;
            text-shadow: -2px 0 #00e5ff;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(40px, 9999px, 80px, 0); }
            40% { clip: rect(20px, 9999px, 50px, 0); }
            60% { clip: rect(70px, 9999px, 90px, 0); }
            80% { clip: rect(30px, 9999px, 60px, 0); }
            100% { clip: rect(50px, 9999px, 100px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 90px, 0); }
            20% { clip: rect(10px, 9999px, 40px, 0); }
            40% { clip: rect(80px, 9999px, 100px, 0); }
            60% { clip: rect(30px, 9999px, 70px, 0); }
            80% { clip: rect(50px, 9999px, 80px, 0); }
            100% { clip: rect(20px, 9999px, 50px, 0); }
        }

        /* Discord Kartı */
        .discord-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.03);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }

        .discord-card:hover {
            border-color: rgba(255,255,255,0.15);
        }

        .avatar-box {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .status-dot {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #747f8d;
            border: 3px solid #0c0c0e;
        }

        .status-dot.online { background: #23a55a; }
        .status-dot.idle { background: #f0b232; }
        .status-dot.dnd { background: #f23f43; }

        .user-info .username {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }

        .user-info .activity {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* YAN YANA LİNK BUTONLARI (STEAM & SPOTIFY) */
        .links-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .steam-btn {
            background: linear-gradient(90deg, #171a21 0%, #1b2838 100%);
            border: 1px solid rgba(102, 192, 244, 0.2);
            color: #c6d4df;
        }

        .steam-btn:hover {
            border-color: #66c0f4;
            color: #fff;
            box-shadow: 0 0 15px rgba(102, 192, 244, 0.3);
            transform: translateY(-2px);
        }

        .spotify-profile-btn {
            background: linear-gradient(90deg, #0f2b17 0%, #123d1f 100%);
            border: 1px solid rgba(30, 215, 96, 0.3);
            color: #1ed760;
        }

        .spotify-profile-btn:hover {
            border-color: #1ed760;
            color: #fff;
            box-shadow: 0 0 15px rgba(30, 215, 96, 0.3);
            transform: translateY(-2px);
        }

        /* Söz Kutusu */
        .quote-box {
            background: rgba(139, 0, 0, 0.12);
            border-left: 3px solid #8b0000;
            padding: 14px 16px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 18px;
        }

        .quote-text {
            font-size: 13px;
            font-style: italic;
            color: #ddd;
            line-height: 1.4;
        }

        /* Spotify Kartı & Equalizer */
        .spotify-card {
            background: rgba(30, 215, 96, 0.05);
            border: 1px solid rgba(30, 215, 96, 0.18);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 18px;
        }

        .spotify-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Equalizer Animasyon Çubukları */
        .equalizer {
            display: none;
            align-items: flex-end;
            gap: 3px;
            height: 14px;
        }

        .equalizer.active {
            display: flex;
        }

        .eq-bar {
            width: 3px;
            background: #1ed760;
            border-radius: 2px;
            animation: eq-bounce 1s infinite ease-in-out alternate;
        }

        .eq-bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }

        @keyframes eq-bounce {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        .spotify-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .spotify-album {
            width: 52px; height: 52px;
            border-radius: 8px;
            object-fit: cover;
        }

        .spotify-info .song-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .spotify-info .artist-name {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Dynamic Son Dinlenenler */
        .recent-songs {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .recent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11.5px;
            transition: background 0.2s;
        }

        .recent-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .recent-item .title { color: #ccc; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
        .recent-item .artist { color: var(--text-muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }

        /* Footer */
        .footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
        }

        .visitor-count {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            padding: 5px 14px;
            border-radius: 20px;
            color: #ddd;
            border:
